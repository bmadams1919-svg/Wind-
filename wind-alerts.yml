# Save this at:  .github/workflows/wind-alerts.yml  in a GitHub repo.
# Then add a repo secret named NTFY_TOPIC (Settings -> Secrets and variables -> Actions).
# It runs every 15 minutes, always-on, for free — no server or computer needed.
#
# Note: GitHub's scheduled runs can be delayed 10-20 min under load and pause after
# ~60 days of repo inactivity. The 60-min lead window absorbs normal delays.

name: wind-alerts

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes (UTC)
  workflow_dispatch:            # lets you run it manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Restore the "already alerted" list from the previous run so we don't double-notify.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: alerted.json
          key: wind-state-${{ github.run_id }}
          restore-keys: wind-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run wind alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WIND_THRESHOLD: "15"
          LEAD_MINUTES: "60"
        run: python wind_alerts.py
